[project]
name = "myproject"
version = "0.1.0"
description = "A new Python project"
authors = [
    { name = "Arnav Sachdeva", email = "your_email@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "joblib>=1.5.2",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
